[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoseal-cli"
version = "0.2.0"
description = "Standalone CLI for embedding and detecting RS-protected PixelSeal watermark IDs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "platformdirs",
    "PyYAML",
    "timm==0.9.16",
    "torch",
]

[project.scripts]
videoseal-cli = "videoseal_cli.cli:main"

[tool.setuptools.packages.find]
include = ["videoseal_cli*"]

[tool.setuptools.package-data]
"videoseal_cli.videoseal_configs" = ["*.yaml"]
"videoseal_cli._vendor.videoseal" = ["LICENSE"]
"videoseal_cli._vendor.reedsolo" = ["LICENSE"]
