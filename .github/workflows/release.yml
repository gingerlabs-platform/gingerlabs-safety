name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-13
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "Linux" ] || [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          else
            python -m pip install torch torchvision
          fi
          python -m pip install -e . pyinstaller
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Locate ffmpeg
        id: ffmpeg
        shell: bash
        run: |
          FFMPEG_PATH="$(python -c "import shutil; print(shutil.which('ffmpeg') or '')")"
          FFPROBE_PATH="$(python -c "import shutil; print(shutil.which('ffprobe') or '')")"
          echo "ffmpeg=$FFMPEG_PATH" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$FFPROBE_PATH" >> "$GITHUB_OUTPUT"
      - name: Cache PixelSeal checkpoint
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pixelseal-model-cache
          key: pixelseal-${{ matrix.artifact }}-0c5665cff20eb6ce1b5aaa7d91c19dafb418bfee32d02dd3344e4ed60d9d75bd
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build archive
        run: python scripts/build_release.py --ffmpeg-bin "${{ steps.ffmpeg.outputs.ffmpeg }}" --ffprobe-bin "${{ steps.ffmpeg.outputs.ffprobe }}" --tag "${{ matrix.artifact }}"
      - name: Test standalone archive
        run: python scripts/release_smoke_test.py --bundle-dir dist/videoseal-cli --model-cache-dir "${{ runner.temp }}/pixelseal-model-cache" --ffmpeg-bin "${{ steps.ffmpeg.outputs.ffmpeg }}" --ffprobe-bin "${{ steps.ffmpeg.outputs.ffprobe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: videoseal-cli-${{ matrix.artifact }}
          path: release/*
